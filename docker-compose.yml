services:
  mongo:
    image: mongo:latest
    container_name: decisionvault-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: decisionvault-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/decisionvault
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET before running docker compose}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NODE_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: decisionvault-client
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
